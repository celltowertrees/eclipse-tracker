[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 requires Node 22.12+
  NODE_VERSION = "22"

# Hashed bundles never change; the eclipse catalog does, so revalidate it.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
